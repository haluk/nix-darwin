# Appended to ~/.config/tmux/tmux.conf after the options set in programs.tmux
# (home.nix: prefix C-b, mouse, vi keys, base index 1, hjkl/HJKL panes, ...).
# Plugins are TPM's, cloned into ~/.config/tmux/plugins by `make switch`;
# `make upgrade` updates them. In tmux: prefix I installs, prefix U updates.

# -- terminal -----------------------------------------------------------------
# Ghostty reports TERM=xterm-ghostty: truecolor, CSI u keys, OSC 8 links, OSC 52
set -as terminal-features ',xterm-ghostty:RGB:extkeys:hyperlinks:clipboard'
set -s extended-keys on
# Image protocols (yazi, kitty graphics) and other escapes reach Ghostty
set -g allow-passthrough on

# -- clipboard / mouse --------------------------------------------------------
# With mouse on, tmux owns the selection, so a drag stays inside one pane and
# copies on release (to the macOS clipboard via OSC 52 and pbcopy). Hold Shift
# to fall back to Ghostty's own selection, which spans panes.
set -s set-clipboard on
set -s copy-command 'pbcopy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# y and mouse release copy via tmux-yank, to the clipboard (not the X primary)
set -g @yank_selection_mouse 'clipboard'

# -- general ------------------------------------------------------------------
set -g renumber-windows on
# Closing the last window of a session switches to another one, not out of tmux
set -g detach-on-destroy off
set -g monitor-activity on
set -g visual-activity off
set -g display-time 2000
set -g status-interval 5
# Window titles for OmniWM / the app switcher
set -g set-titles on
set -g set-titles-string '#S: #W'

# -- bindings -----------------------------------------------------------------
# Splits and new windows start in the current pane's directory
unbind '"'
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

bind C-c new-session -c '~'
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf reloaded'
# Kill the server: every Ghostty window closes, so Ghostty quits too
bind Q confirm-before -p 'kill tmux server? (y/n)' kill-server

# -- theme: catppuccin's layout in One Dark colours ----------------------------
# The catppuccin plugin draws the bar (rounded window pills, icon modules); its
# palette slots are filled with One Dark so it matches Ghostty's Atom One Dark.
# They must be set before TPM loads it: the theme only fills slots left unset.
set -g @thm_bg '#282c34'
set -g @thm_fg '#abb2bf'
set -g @thm_rosewater '#e5c07b'
set -g @thm_flamingo '#e06c75'
set -g @thm_pink '#c678dd'
set -g @thm_mauve '#c678dd'
set -g @thm_red '#e06c75'
set -g @thm_maroon '#be5046'
set -g @thm_peach '#d19a66'
set -g @thm_yellow '#e5c07b'
set -g @thm_green '#98c379'
set -g @thm_teal '#56b6c2'
set -g @thm_sky '#56b6c2'
set -g @thm_sapphire '#56b6c2'
set -g @thm_blue '#61afef'
set -g @thm_lavender '#61afef'
set -g @thm_subtext_1 '#abb2bf'
set -g @thm_subtext_0 '#9da5b4'
set -g @thm_overlay_2 '#7f848e'
set -g @thm_overlay_1 '#636d83'
set -g @thm_overlay_0 '#5c6370'
set -g @thm_surface_2 '#4b5263'
set -g @thm_surface_1 '#3e4452'
set -g @thm_surface_0 '#2c313a'
set -g @thm_mantle '#21252b'
set -g @thm_crust '#181a1f'

set -g @catppuccin_window_status_style 'rounded'
# #W, not the pane title: tmux-nerd-font-window-name puts the program icon there
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_current_number_color '#{@thm_blue}'
set -g @catppuccin_date_time_text ' %a %d %b %H:%M'
# Short hostname (#h), without .local
set -g @catppuccin_host_text ' #h'

set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
# Running program, zoom flag, session (red while the prefix is pressed), clock, host
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{?window_zoomed_flag,#[fg=#e5c07b]  zoom ,}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_date_time}'
set -ag status-right '#{E:@catppuccin_status_host}'

# Not covered by the theme: copy-mode search matches, rounded popups, menus
setw -g copy-mode-match-style 'fg=#282c34,bg=#5c6370'
setw -g copy-mode-current-match-style 'fg=#282c34,bg=#c678dd'
set -g popup-border-lines rounded
set -g menu-style 'fg=#abb2bf,bg=#21252b'
set -g menu-selected-style 'fg=#282c34,bg=#61afef'
set -g menu-border-style 'fg=#3e4452'

# -- plugins ------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.3.2'                # cloned as plugins/tmux
set -g @plugin 'sainnhe/tmux-fzf'                       # prefix F
set -g @plugin 'alberti42/tmux-fzf-links'               # prefix C-h: open a URL/path on screen
set -g @plugin 'jaclu/tmux-menus'                       # prefix \
set -g @plugin 'noscript/tmux-mighty-scroll'            # wheel scrolls less/vim, not just tmux
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'jaclu/tmux-power-zoom'                  # prefix Z
# Session picker with previews; zoxide dirs become new sessions (prefix O)
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-zoxide-mode 'on'
# fzf over words/paths/URLs on screen: Tab inserts, Enter copies (prefix Tab)
set -g @plugin 'laktak/extrakto'
# Floating scratch terminal that keeps running when hidden (prefix f; inside it,
# prefix P opens its menu). Its default, prefix p, would shadow previous-window.
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'f'
# Sessions are saved every 15 min but not restored on start, so tmux starts
# clean; prefix C-r restores the last save (e.g. after a reboot).
# continuum hooks into status-right, so the theme must be set before TPM runs.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'

run '~/.config/tmux/plugins/tpm/tpm'
